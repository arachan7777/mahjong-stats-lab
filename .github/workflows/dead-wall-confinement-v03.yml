name: 王牌幽閉率 v0.3・流局時最終テンパイ再集計
on:
  push:
    paths:
      - '.github/workflows/dead-wall-confinement-v03.yml'
      - 'scripts/rank_dead_wall_confinement_v03.py'
      - 'sql/dead_wall_confinement_v03.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 最新SQLite ZIPを取得
        run: |
          set -euo pipefail
          URL=https://github.com/konoui/m-league-game-db/releases/latest/download/database.zip
          curl -fL --retry 3 "$URL" -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          z=zipfile.ZipFile('/tmp/database.zip')
          files=[x for x in z.infolist() if not x.is_dir() and (x.filename.endswith('.sqlite3') or x.filename.endswith('.sqlite') or x.filename.endswith('.db'))]
          print('SQLite candidates:',[(x.filename,x.file_size) for x in files],flush=True)
          if len(files)!=1: raise RuntimeError('Expected exactly one SQLite database')
          with z.open(files[0]) as src,open('/tmp/ml.sqlite3','wb') as dst:
              shutil.copyfileobj(src,dst)
          PY
      - name: 全期間・シーズン別再集計
        run: python -u scripts/rank_dead_wall_confinement_v03.py /tmp/ml.sqlite3
      - name: 集計成果物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-wall-confinement-v03-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
