name: Mリーグ最新版DBの検証

on:
  workflow_dispatch:
  push:
    paths:
      - 'run-once-20261119.txt'

permissions:
  contents: read

jobs:
  validate:
    name: 最新版SQLiteの取得と整合性検証
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 最新公開DBの取得・検証
        run: python scripts/check_latest_db.py --output results

      - name: 検証レポートを保存（DB本体は保存しない）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-db-validation-report
          path: |
            results/summary.md
            results/summary.json
          if-no-files-found: warn
          retention-days: 7
