name: 土壇場ラス回避率 v0.1 試算・第19指標との突合
on:
  push:
    branches:
      - trial/last-place-escape-20261122
    paths:
      - '.github/workflows/last-place-escape-v01-trial.yml'
      - 'sql/last_place_escape_v01_trial.sql'
      - 'scripts/rank_last_place_escape_v01_trial.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 公開DBを一時展開
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/latest/download/database.zip' -o /tmp/mahjong-db.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/mahjong-db.zip') as z:
              choices=[e for e in z.infolist() if not e.is_dir() and e.filename.lower().endswith(('.sqlite3','.sqlite','.db','.db3'))]
              print('candidates',[(e.filename,e.file_size) for e in choices],flush=True)
              if len(choices)!=1: raise RuntimeError('Expected one SQLite DB')
              with z.open(choices[0]) as source,open('/tmp/mahjong.sqlite3','wb') as dest:
                  shutil.copyfileobj(source,dest)
          PY
      - name: 全期間と旧期間を集計し第19指標と照合
        run: python -u scripts/rank_last_place_escape_v01_trial.py /tmp/mahjong.sqlite3
      - name: 試算データの保管
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-place-escape-v01-trial
          path: results/
          if-no-files-found: warn
          retention-days: 7
