name: 逢川恵夢・リッチロンハイ率 第2回検証（隔離）
on:
  push:
    branches:
      - trial/aikawa-ricchi-20261123
    paths:
      - '.github/workflows/aikawa-ricchi-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 2026-11-20版公開DBを取得
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
              f=[x for x in z.infolist() if not x.is_dir() and x.filename.endswith('.sqlite3')]
              assert len(f)==1,f
              with z.open(f[0]) as src,open('/tmp/ml.sqlite3','wb') as dst:
                  shutil.copyfileobj(src,dst)
          PY
      - name: リッチロンハイ率の全選手・年度別・基本統計の照合
        run: python -u scripts/aikawa_ricchi_20261123.py /tmp/ml.sqlite3
      - name: 結果保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aikawa-ricchi-profile-20261123
          path: results/
          retention-days: 7
          if-no-files-found: warn
