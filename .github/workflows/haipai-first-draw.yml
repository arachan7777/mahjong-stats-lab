name: 配牌格差と初手有効牌
on:
  push:
    branches: [research/haipai-first-draw-20261120]
  pull_request:
    paths: ['scripts/haipai_first_draw.py']
permissions:
  contents: read
jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 固定版集計
        run: |
          curl -fsSL --retry 3 https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip -o /tmp/source.zip
          dbpath=$(unzip -Z1 /tmp/source.zip | grep -E '\.(db|sqlite3|sqlite)$' | head -1)
          unzip -p /tmp/source.zip "$dbpath" > fixed.db
          python -m pip install mahjong==1.4.0
          python scripts/haipai_first_draw.py
      - uses: actions/upload-artifact@v4
        with:
          name: haipai-first-draw-20261120
          path: '*.csv'
