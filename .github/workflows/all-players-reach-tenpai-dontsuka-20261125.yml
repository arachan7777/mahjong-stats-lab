name: 全選手の立直・テンパイ別ドンツカ率比較（隔離検証）
on:
  push:
    paths:
      - '.github/workflows/all-players-reach-tenpai-dontsuka-20261125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned public DB read-only
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
              files=[i for i in z.infolist() if not i.is_dir() and i.filename.endswith(('.sqlite3','.sqlite','.db'))]
              assert len(files)==1,files
              with z.open(files[0]) as src,open('/tmp/ml.sqlite3','wb') as dst:shutil.copyfileobj(src,dst)
          PY
      - name: Compare all players and validate historical totals
        run: python -u scripts/all_players_reach_tenpai_dontsuka_20261125.py /tmp/ml.sqlite3
      - name: Upload comparison data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-players-reach-tenpai-dontsuka-20261125
          path: results/
          if-no-files-found: warn
          retention-days: 7
