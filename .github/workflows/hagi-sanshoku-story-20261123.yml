name: 萩原聖人・年度別Mリーグ実績（研究用）
on:
  push:
    branches:
      - trial/hagi-sanshoku-story-20261123
    paths:
      - '.github/workflows/hagi-sanshoku-story-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 正本DBの取得
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
              files=[x for x in z.infolist() if not x.is_dir() and x.filename.endswith('.sqlite3')]
              assert len(files)==1
              with z.open(files[0]) as src,open('/tmp/ml.sqlite3','wb') as dst:shutil.copyfileobj(src,dst)
          PY
      - name: 保存済み正式SQLで年度別結果を検算
        run: python -u research/hagi_sanshoku_story_season_points.py /tmp/ml.sqlite3
