name: ドンツカ四区分×選手戦績の相関検証（隔離）
on:
  push:
    paths:
      - '.github/workflows/four-state-performance-correlation-20261126.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed M-League game DB
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
              files=[i for i in z.infolist() if not i.is_dir() and i.filename.endswith(('.sqlite3','.sqlite','.db'))]
              assert len(files)==1,files
              with z.open(files[0]) as src,open('/tmp/ml.sqlite3','wb') as dst:shutil.copyfileobj(src,dst)
          PY
      - name: Compute performance comparisons and correlations
        run: python -u scripts/four_state_performance_correlations_20261126.py /tmp/ml.sqlite3
      - name: Store validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-state-player-performance-correlations-20261126
          path: results/
          if-no-files-found: warn
          retention-days: 7
