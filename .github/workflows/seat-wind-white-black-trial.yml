name: 初期座席別の強弱・白卓黒卓比較 試算
on:
  push:
    branches:
      - trial/seat-wind-white-black-20261123
    paths:
      - '.github/workflows/seat-wind-white-black-trial.yml'
      - 'sql/seat_wind_white_black_trial.sql'
      - 'scripts/rank_seat_wind_white_black_trial.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 公開SQLite原本のダウンロード
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/latest/download/database.zip' -o /tmp/mleague.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/mleague.zip') as z:
              candidates=[e for e in z.infolist() if not e.is_dir() and e.filename.lower().endswith(('.db','.db3','.sqlite','.sqlite3'))]
              print("SQLite files",[(e.filename,e.file_size) for e in candidates],flush=True)
              if len(candidates)!=1: raise RuntimeError("Expected exactly one database in zip")
              with z.open(candidates[0]) as source,open('/tmp/mleague.sqlite3','wb') as target: shutil.copyfileobj(source,target)
          PY
      - name: 座席・卓色・公式IDと順位を検証して集計
        run: python -u scripts/rank_seat_wind_white_black_trial.py /tmp/mleague.sqlite3
      - name: CSVとJSON結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seat-wind-white-black-trial-results
          path: results/
          if-no-files-found: warn
          retention-days: 7
