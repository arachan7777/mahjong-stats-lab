name: クマクマタイム率・全試合検証
on:
  push:
    paths:
      - '.github/workflows/kumakuma-time.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 最新SQLite ZIPを取得
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://api.github.com/repos/konoui/m-league-game-db/releases/latest | python -c 'import json,sys; print(next(a["browser_download_url"] for a in json.load(sys.stdin)["assets"] if a["name"]=="database.zip"))')
          curl -fL --retry 3 "$URL" -o /tmp/database.zip
          python - <<'PY'
          import zipfile,os
          z=zipfile.ZipFile('/tmp/database.zip')
          files=[x for x in z.infolist() if not x.is_dir() and (x.filename.endswith('.sqlite3') or x.filename.endswith('.sqlite') or x.filename.endswith('.db'))]
          print('SQLite candidates:',[(x.filename,x.file_size) for x in files],flush=True)
          if len(files)!=1: raise RuntimeError('Expected exactly one SQLite database')
          with z.open(files[0]) as src,open('/tmp/ml.sqlite3','wb') as dst:
              import shutil
              shutil.copyfileobj(src,dst)
          PY
      - name: DB整合性確認と全選手集計
        run: |
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/tmp/ml.sqlite3?mode=ro',uri=True)
          result=c.execute('PRAGMA quick_check').fetchone()[0]
          print('quick_check:',result)
          assert result=='ok'
          PY
          python -u scripts/rank_kumakuma_time.py /tmp/ml.sqlite3
      - name: ランキング成果物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kumakuma-time-v01-validation
          path: results/
          if-no-files-found: warn
          retention-days: 7
