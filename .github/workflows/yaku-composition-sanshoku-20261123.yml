name: 和了役構成比（三色同順）正式SQL検算
on:
  push:
    branches:
      - trial/yaku-composition-sanshoku-20261123
    paths:
      - '.github/workflows/yaku-composition-sanshoku-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 正本DB（2026年11月20日版）取得
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
              f=[x for x in z.infolist() if not x.is_dir() and x.filename.endswith('.sqlite3')]
              assert len(f)==1,f
              with z.open(f[0]) as src,open('/tmp/ml.sqlite3','wb') as dst:shutil.copyfileobj(src,dst)
          PY
      - name: 全56選手／シーズン／ステージのSQL値と役イベントを独立照合
        run: python -u research/verify_yaku_composition_sanshoku_20261123.py /tmp/ml.sqlite3
      - name: 集計結果をファイル保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaku-composition-sanshoku-20261123
          path: results/
          retention-days: 30
          if-no-files-found: error
