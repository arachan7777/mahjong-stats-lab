name: 鈴木優 独立指標横断・研究用スカウト
on:
  push:
    branches: [trial/suzuki-yu-scout-20261125]
    paths:
      - '.github/workflows/suzuki-yu-scout-20261125.yml'
      - 'research/suzuki_yu_independent_metrics_scout_20261125.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 固定版DBを取得
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
            fs=[i for i in z.infolist() if not i.is_dir() and i.filename.endswith('.sqlite3')]
            assert len(fs)==1
            with z.open(fs[0]) as a,open('/tmp/ml.sqlite3','wb') as b:shutil.copyfileobj(a,b)
          PY
      - name: 認定済みSQLを変更せず横断実行
        run: python -u research/suzuki_yu_independent_metrics_scout_20261125.py /tmp/ml.sqlite3
      - name: 一時結果アーティファクト
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suzuki-yu-scout-20261125
          path: results/
          retention-days: 30
          if-no-files-found: warn
