name: 永井孝典 赤ドラの出会いと結末（隔離研究）
on:
  push:
    branches: [trial/nagai-red-story-20261124]
    paths:
      - '.github/workflows/nagai-red-love-story-20261124.yml'
      - 'research/nagai_red_love_story_20261124.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 2026-11-20版確定DB
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
            fs=[i for i in z.infolist() if not i.is_dir() and i.filename.endswith('.sqlite3')]
            assert len(fs)==1,fs
            with z.open(fs[0]) as a,open('/tmp/ml.sqlite3','wb') as b:shutil.copyfileobj(a,b)
          PY
      - name: 赤ドラ取得→打牌→放銃→和了の行方を追跡
        run: python -u research/nagai_red_love_story_20261124.py /tmp/ml.sqlite3
      - name: 研究用の検算ファイル
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagai-red-love-story-20261124
          path: results/
          retention-days: 30
          if-no-files-found: warn
