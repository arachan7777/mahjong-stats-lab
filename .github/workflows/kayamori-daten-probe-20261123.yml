name: 茅森早香・平均打点とドラ／手役の分解（研究用）
on:
  push:
    branches:
      - trial/kayamori-daten-analysis-20261123
    paths:
      - '.github/workflows/kayamori-daten-probe-20261123.yml'
      - 'research/kayamori_daten_probe_20261123.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 正式DB固定版を取得
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
            fs=[x for x in z.infolist() if not x.is_dir() and x.filename.endswith('.sqlite3')]
            assert len(fs)==1
            with z.open(fs[0]) as src,open('/tmp/ml.sqlite3','wb') as dst:shutil.copyfileobj(src,dst)
          PY
      - name: 平均和了点・一和了ごとの役翻・ドラ翻を全件照合
        run: python -u research/kayamori_daten_probe_20261123.py /tmp/ml.sqlite3
      - name: 研究結果CSVと詳細JSONを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kayamori-daten-probe-20261123
          path: results/
          retention-days: 30
          if-no-files-found: warn
