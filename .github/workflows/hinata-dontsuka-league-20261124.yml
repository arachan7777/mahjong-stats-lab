name: 日向藍子ドンツカ率・年度別リーグ基準（隔離研究）
on:
  push:
    branches: [trial/hinata-seasons-20261124]
    paths:
      - '.github/workflows/hinata-dontsuka-league-20261124.yml'
      - 'research/dontsuka_league_seasons_20261124.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 正式DBの同一スナップショットを取得
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/konoui/m-league-game-db/releases/download/20261120-2341-04338cbb/database.zip' -o /tmp/database.zip
          python - <<'PY'
          import zipfile,shutil
          with zipfile.ZipFile('/tmp/database.zip') as z:
            files=[x for x in z.infolist() if not x.is_dir() and x.filename.endswith('.sqlite3')]
            assert len(files)==1
            with z.open(files[0]) as src,open('/tmp/ml.sqlite3','wb') as dest:shutil.copyfileobj(src,dest)
          PY
      - name: ドンツカ率の既存判定・全選手全年度集計を検算
        run: python -u research/dontsuka_league_seasons_20261124.py /tmp/ml.sqlite3
      - name: CSV保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hinata-dontsuka-league-seasons-20261124
          path: results/
          retention-days: 30
          if-no-files-found: warn
